<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🌐 Navegador FTP - SIA Datasus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🌐 Navegador FTP - SIA Datasus</span>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="container-main">
                    <div class="row mb-3">
                        <div class="col-md-10">
                            <input type="text" class="form-control url-input" id="urlInput" 
                                   placeholder="Digite a URL (http://, https:// ou ftp://)..."
                                   value="http://sia.datasus.gov.br/principal/index.php">
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-custom w-100" onclick="navigateToUrl()">Acessar</button>
                        </div>
                    </div>
                    
                    <div id="statusMessage"></div>
                    
                    <div class="iframe-container">
                        <iframe id="browserFrame" 
                                src="/navigate?url=http://sia.datasus.gov.br/principal/index.php"
                                sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
